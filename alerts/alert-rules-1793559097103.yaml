apiVersion: 1
groups:
    - orgId: 1
      name: Nginx Alerts Group
      folder: Nginx Alerts"
      interval: 30s
      rules:
        - uid: dg30ex6tq3lz4b
          title: NginxDown
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: fg30411zxhnuof
              model:
                datasource:
                    type: prometheus
                    uid: fg30411zxhnuof
                editorMode: code
                expr: nginx_up
                hide: false
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            summary: NginxDown
          isPaused: false
          notification_settings:
            receiver: Email Alert
        - uid: cg30f9qkw0fswf
          title: InstanceDown
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: fg30411zxhnuof
              model:
                datasource:
                    type: prometheus
                    uid: fg30411zxhnuof
                editorMode: code
                expr: up{job="node"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: Node exporter instance is down
            summary: InstanceDown
          isPaused: false
          notification_settings:
            receiver: Email Alert
